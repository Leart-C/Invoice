services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - invoice_network

  nginx:
    image: nginx:alpine
    container_name: invoice_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - invoice_network

  mysql:
    image: mysql:8.0
    container_name: invoice_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invoice_tracker
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: invoice_user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - invoice_network

  redis:
    image: redis:7-alpine
    container_name: invoice_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - invoice_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: invoice_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: invoice_user
      PMA_PASSWORD: secret
    networks:
      - invoice_network

networks:
  invoice_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
